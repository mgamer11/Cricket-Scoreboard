<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Scoreboard">
<meta name="theme-color" content="#0B120D">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.json?v=2">
<title>Cricket Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header>
    <h1>Cricket Scoreboard</h1>
    <div class="header-actions">
      <button class="icon-btn" id="syncBtn"><span class="sync-dot"></span><span id="syncBtnText">Sync</span></button>
      <button class="icon-btn" id="settingsBtn">⚙ Teams</button>
    </div>
  </header>

  <div class="panel" id="syncPanel">
    <div class="sync-section" id="syncOff">
      <button class="sync-start" data-action="sync-start">Start live sync</button>
      <div class="player-add-row">
        <input type="text" id="syncCodeInput" placeholder="Match code" maxlength="6"
          autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
        <button data-action="sync-join">Join</button>
      </div>
    </div>
    <div class="sync-section" id="syncOn">
      <div class="striker-label">Match code</div>
      <div class="sync-code" id="syncCodeEl"></div>
      <div class="sync-status" id="syncStatusEl"></div>
      <button class="reset-link" data-action="sync-stop">Stop sync on this phone</button>
    </div>
  </div>

  <button class="extra-toggle" id="extraToggle" role="switch" aria-checked="false">
    <span class="extra-label">+1 run on Wide / No Ball</span>
    <span class="switch"><span class="knob"></span></span>
  </button>

  <div class="panel" id="teamsPanel">
    <div class="team-card">
      <input class="team-name-input" id="teamNameA" maxlength="20" value="Team A">
      <div class="player-add-row">
        <input type="text" id="addPlayerA" placeholder="Player name" maxlength="18">
        <button data-action="add-player" data-team="0">+</button>
      </div>
      <div class="player-list" id="playerListA"></div>
    </div>
    <div class="team-card">
      <input class="team-name-input" id="teamNameB" maxlength="20" value="Team B">
      <div class="player-add-row">
        <input type="text" id="addPlayerB" placeholder="Player name" maxlength="18">
        <button data-action="add-player" data-team="1">+</button>
      </div>
      <div class="player-list" id="playerListB"></div>
    </div>
    <div>
      <div class="striker-label" style="margin-bottom:6px;">Currently Batting</div>
      <div class="batting-toggle">
        <button data-action="set-batting" data-team="0" id="battingBtnA">Team A</button>
        <button data-action="set-batting" data-team="1" id="battingBtnB">Team B</button>
      </div>
      <div class="panel-hint" id="battingHint"></div>
    </div>
    <button class="reset-link" data-action="reset-match">Reset Match (keep rosters)</button>
  </div>

  <div class="board">
    <div class="batting-label" id="battingLabel">TEAM A BATTING</div>
    <div class="score-row">
      <span class="score-main" id="runsEl">0</span>
      <span class="score-sep">/</span>
      <span class="score-wk" id="wicketsEl">0</span>
    </div>
    <div class="sub-row">
      <span class="sub-label">Overs</span>
      <span class="sub-value" id="oversEl">0.0</span>
      <span class="allout" id="alloutEl">ALL OUT</span>
    </div>
    <div class="target-row" id="targetRow">
      <div class="target-need" id="targetNeed"></div>
      <div class="target-sub" id="targetSub"></div>
    </div>
  </div>

  <div class="ledger-wrap" id="ledgerWrap"></div>

  <div class="striker-wrap" id="strikerWrap">
    <div class="striker-row" id="strikerRow"></div>
  </div>

  <div class="pad">
    <button class="run-btn" data-run="0">0</button>
    <button class="run-btn" data-run="1">1</button>
    <button class="run-btn" data-run="2">2</button>
    <button class="run-btn" data-run="3">3</button>
    <button class="run-btn four" data-run="4">4</button>
    <button class="run-btn six" data-run="6">6</button>
  </div>

  <div class="btn-row">
    <button class="wide-btn wicket-btn" id="wicketBtn">Wicket</button>
    <button class="wide-btn runout-btn" id="runoutBtn">
      <span>Run Out</span>
      <span class="nb-state" id="roState"></span>
    </button>
  </div>

  <div class="btn-row">
    <button class="wide-btn wideball-btn" id="wideBtn">
      <span>Wide</span>
      <span class="nb-state" id="wdState"></span>
    </button>
    <button class="wide-btn noball-btn" id="noballBtn">
      <span>No Ball</span>
      <span class="nb-state" id="nbState"></span>
    </button>
  </div>

  <button class="wide-btn undo-btn" id="undoBtn" disabled>
    <span class="undo-main">⤺ Undo Last Ball</span>
    <span class="undo-sub" id="undoSub">Nothing to undo</span>
  </button>

  <button class="wide-btn new-innings-btn" id="newInningsBtn">New Innings</button>

  <input type="checkbox" id="hapticSwitch" tabindex="-1" aria-hidden="true"
    style="position:fixed; top:-100px; left:-100px; width:1px; height:1px; opacity:0; pointer-events:none;">
</div>

<script>
  let playerSeed = 1;

  const state = {
    teams: [
      { name: 'Team A', players: [] },
      { name: 'Team B', players: [] }
    ],
    battingTeamIndex: 0,
    strikerId: null,
    runs: 0,
    wickets: 0,
    overs: 0,
    ball: 0,
    history: [],
    noBallArmed: false,
    runOutArmed: false,
    extraRunOn: false,
    target: null,
    prevSummary: null
  };

  const el = id => document.getElementById(id);
  const runsEl = el('runsEl'), wicketsEl = el('wicketsEl'), oversEl = el('oversEl');
  const alloutEl = el('alloutEl');
  const ledgerWrap = el('ledgerWrap');
  const undoBtn = el('undoBtn'), undoSub = el('undoSub');
  const wicketBtn = el('wicketBtn'), noballBtn = el('noballBtn'), nbState = el('nbState');
  const runoutBtn = el('runoutBtn'), roState = el('roState');
  const wideBtn = el('wideBtn'), wdState = el('wdState');
  const extraToggle = el('extraToggle');
  const strikerWrap = el('strikerWrap');
  const runButtons = document.querySelectorAll('.run-btn');
  const battingLabel = el('battingLabel');
  const targetRow = el('targetRow'), targetNeed = el('targetNeed'), targetSub = el('targetSub');
  const strikerRow = el('strikerRow');
  const teamsPanel = el('teamsPanel'), settingsBtn = el('settingsBtn');
  const teamNameA = el('teamNameA'), teamNameB = el('teamNameB');
  const playerListA = el('playerListA'), playerListB = el('playerListB');
  const battingBtnA = el('battingBtnA'), battingBtnB = el('battingBtnB'), battingHint = el('battingHint');

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function findPlayer(id){
    if(id == null) return null;
    for(const t of state.teams){
      const p = t.players.find(p => p.id === id);
      if(p) return p;
    }
    return null;
  }

  function ballLabel(){ return state.overs + '.' + (state.ball + 1); }
  function nbLabel(){ return state.overs + '.' + (state.ball + 1) + 'nb'; }
  function wdLabel(){ return state.overs + '.' + (state.ball + 1) + 'wd'; }
  function advanceBall(){ state.ball += 1; if(state.ball === 6){ state.ball = 0; state.overs += 1; } }
  function reverseBall(){ if(state.ball === 0){ state.overs -= 1; state.ball = 5; } else { state.ball -= 1; } }

  function describe(entry){
    const player = findPlayer(entry.playerId);
    const name = player ? player.name.toUpperCase() + ' · ' : '';
    if(entry.type === 'wicket'){
      const dp = findPlayer(entry.dismissedPlayerId);
      return { text: (dp ? dp.name.toUpperCase() + ' ' : '') + 'OUT', cls:'wicket' };
    }
    if(entry.type === 'runout'){
      const dp = findPlayer(entry.dismissedPlayerId);
      return { text: (dp ? dp.name.toUpperCase() + ' ' : '') + 'RUN OUT +' + entry.value, cls:'wicket' };
    }
    if(entry.type === 'noball'){
      const extra = entry.extra || 0, bat = entry.batValue || 0;
      const txt = extra ? 'NO BALL +' + extra + (bat > 0 ? ' +' + bat : '') : 'NO BALL +' + entry.value;
      return { text: name + txt, cls:'noball' };
    }
    if(entry.type === 'wide'){
      return { text: 'WIDE' + (entry.value ? ' +' + entry.value : ''), cls:'wide' };
    }
    if(entry.value === 6) return { text: name + 'SIX +6', cls:'six' };
    if(entry.value === 4) return { text: name + 'FOUR +4', cls:'four' };
    if(entry.value === 0) return { text: name + 'DOT BALL', cls:'dot' };
    return { text: name + entry.value + ' RUN' + (entry.value>1?'s':''), cls:'run' };
  }

  function addRun(n){
    if(state.wickets >= 10) return;
    const striker = state.strikerId;
    if(state.runOutArmed){
      const credited = Math.max(0, n - 1);
      state.history.push({ type:'runout', value: credited, batValue: credited, playerId: striker, dismissedPlayerId: striker, label: ballLabel() });
      state.runs += credited;
      if(striker){ const p = findPlayer(striker); if(p){ p.runs += credited; p.out = true; } }
      state.wickets += 1;
      state.strikerId = null;
      state.runOutArmed = false;
      advanceBall();
      render(true);
      return;
    }
    if(state.noBallArmed){
      const extra = state.extraRunOn ? 1 : 0;
      state.history.push({ type:'noball', value: n + extra, batValue: n, extra: extra, playerId: striker, label: nbLabel() });
      state.runs += n + extra;
      if(striker){ const p = findPlayer(striker); if(p) p.runs += n; }
      state.noBallArmed = false;
      render(true);
      return;
    }
    state.history.push({ type:'run', value:n, batValue:n, playerId: striker, label: ballLabel() });
    state.runs += n;
    if(striker){ const p = findPlayer(striker); if(p) p.runs += n; }
    advanceBall();
    render(true);
  }

  function addWicket(){
    if(state.wickets >= 10) return;
    state.noBallArmed = false;
    state.runOutArmed = false;
    const striker = state.strikerId;
    state.history.push({ type:'wicket', value:0, batValue:0, playerId:null, dismissedPlayerId: striker, label: ballLabel() });
    state.wickets += 1;
    if(striker){ const p = findPlayer(striker); if(p) p.out = true; }
    state.strikerId = null;
    advanceBall();
    render(true);
  }

  function addWide(){
    if(state.wickets >= 10) return;
    state.noBallArmed = false;
    state.runOutArmed = false;
    const extra = state.extraRunOn ? 1 : 0;
    // A wide is not a legal delivery: runs go to the team only, and the ball count does not move.
    state.history.push({ type:'wide', value: extra, batValue: 0, playerId: null, label: wdLabel() });
    state.runs += extra;
    render(true);
  }

  function toggleExtraRun(){
    state.extraRunOn = !state.extraRunOn;
    render(false);
  }

  function toggleNoBall(){
    if(state.wickets >= 10) return;
    state.noBallArmed = !state.noBallArmed;
    if(state.noBallArmed) state.runOutArmed = false;
    render(false);
  }

  function toggleRunOut(){
    if(state.wickets >= 10) return;
    state.runOutArmed = !state.runOutArmed;
    if(state.runOutArmed) state.noBallArmed = false;
    render(false);
  }

  function undo(){
    if(state.noBallArmed || state.runOutArmed){
      state.noBallArmed = false; state.runOutArmed = false;
      render(false); return;
    }
    const last = state.history.pop();
    if(!last) return;
    if(last.type !== 'noball' && last.type !== 'wide'){ reverseBall(); }
    state.runs -= last.value;
    if(last.playerId){ const p = findPlayer(last.playerId); if(p) p.runs -= (last.batValue != null ? last.batValue : last.value); }
    if(last.type === 'wicket' || last.type === 'runout'){
      state.wickets -= 1;
      if(last.dismissedPlayerId){
        const p = findPlayer(last.dismissedPlayerId);
        if(p){ p.out = false; }
        state.strikerId = last.dismissedPlayerId;
      }
    }
    render(false);
  }

  function startNewInnings(){
    const hasScore = state.history.length > 0;
    const msg = hasScore
      ? 'Start a new innings? ' + state.teams[state.battingTeamIndex].name + ' score becomes the target to chase.'
      : 'Clear the board and start fresh?';
    if(!confirm(msg)) return;
    if(hasScore){
      state.prevSummary = {
        team: state.teams[state.battingTeamIndex].name,
        runs: state.runs, wickets: state.wickets, overs: state.overs, ball: state.ball
      };
      state.target = state.runs + 1;
      state.battingTeamIndex = state.battingTeamIndex === 0 ? 1 : 0;
    } else {
      state.target = null;
      state.prevSummary = null;
    }
    state.runs = 0; state.wickets = 0; state.overs = 0; state.ball = 0;
    state.history = []; state.noBallArmed = false; state.runOutArmed = false; state.strikerId = null;
    render(false);
  }

  function resetMatch(){
    if(!confirm('Reset the match? Player and team names stay, everything else clears.')) return;
    state.teams.forEach(t => t.players.forEach(p => { p.runs = 0; p.out = false; }));
    state.battingTeamIndex = 0; state.strikerId = null;
    state.runs = 0; state.wickets = 0; state.overs = 0; state.ball = 0;
    state.history = []; state.noBallArmed = false; state.runOutArmed = false; state.target = null; state.prevSummary = null;
    render(false);
  }

  function addPlayer(teamIdx){
    const input = teamIdx === 0 ? el('addPlayerA') : el('addPlayerB');
    const name = input.value.trim();
    if(!name) return;
    state.teams[teamIdx].players.push({ id: playerSeed++, name, runs: 0, out: false });
    input.value = '';
    render(false);
  }

  function removePlayer(teamIdx, id){
    const team = state.teams[teamIdx];
    team.players = team.players.filter(p => p.id !== id);
    if(state.strikerId === id) state.strikerId = null;
    render(false);
  }

  function setBattingTeam(idx){
    if(state.history.length > 0) return;
    state.battingTeamIndex = idx;
    state.strikerId = null;
    render(false);
  }

  function selectStriker(id){
    const p = findPlayer(id);
    if(!p || p.out || state.wickets >= 10) return;
    state.strikerId = (state.strikerId === id) ? null : id;
    render(false);
  }

  function renderTeamsPanel(){
    // Don't overwrite a name while it's being typed (a synced update could arrive mid-word)
    if(document.activeElement !== teamNameA) teamNameA.value = state.teams[0].name;
    if(document.activeElement !== teamNameB) teamNameB.value = state.teams[1].name;

    [ [playerListA, 0], [playerListB, 1] ].forEach(([container, idx]) => {
      container.innerHTML = state.teams[idx].players.map(p => `
        <span class="player-tag">
          ${p.out ? '<s>' + esc(p.name) + '</s>' : esc(p.name)}
          <span class="runs">${p.runs}</span>
          <button class="rm" data-action="remove-player" data-team="${idx}" data-id="${p.id}">×</button>
        </span>
      `).join('');
    });

    const locked = state.history.length > 0;
    battingBtnA.classList.toggle('active', state.battingTeamIndex === 0);
    battingBtnB.classList.toggle('active', state.battingTeamIndex === 1);
    battingBtnA.disabled = locked; battingBtnB.disabled = locked;
    battingHint.textContent = locked ? 'Use "New Innings" to switch sides mid-match.' : '';
  }

  function renderStrikerRow(){
    const team = state.teams[state.battingTeamIndex];
    strikerWrap.style.display = team.players.length === 0 ? 'none' : '';
    if(team.players.length === 0){
      strikerRow.innerHTML = '';
      return;
    }
    strikerRow.innerHTML = team.players.map(p => `
      <button class="striker-chip ${p.id === state.strikerId ? 'selected' : ''} ${p.out ? 'out' : ''}"
        data-action="select-striker" data-id="${p.id}" ${p.out ? 'disabled' : ''}>
        ${esc(p.name)} <span class="r">${p.runs}${p.out ? ' · OUT' : ''}</span>
      </button>
    `).join('');
  }

  function render(justScored){
    runsEl.textContent = state.runs;
    wicketsEl.textContent = state.wickets;
    oversEl.textContent = state.overs + '.' + state.ball;
    battingLabel.textContent = state.teams[state.battingTeamIndex].name.toUpperCase() + ' BATTING';

    const allOut = state.wickets >= 10;
    alloutEl.classList.toggle('show', allOut);

    wicketBtn.disabled = allOut;
    wicketBtn.style.opacity = allOut ? '0.35' : '1';
    wicketBtn.style.pointerEvents = allOut ? 'none' : 'auto';
    noballBtn.disabled = allOut;
    noballBtn.style.opacity = allOut ? '0.35' : '1';
    noballBtn.style.pointerEvents = allOut ? 'none' : 'auto';
    runoutBtn.disabled = allOut;
    runoutBtn.style.opacity = allOut ? '0.35' : '1';
    runoutBtn.style.pointerEvents = allOut ? 'none' : 'auto';
    wideBtn.disabled = allOut;
    wideBtn.style.opacity = allOut ? '0.35' : '1';
    wideBtn.style.pointerEvents = allOut ? 'none' : 'auto';
    runButtons.forEach(b=>{ b.disabled = allOut; });

    extraToggle.classList.toggle('on', state.extraRunOn);
    extraToggle.setAttribute('aria-checked', state.extraRunOn ? 'true' : 'false');

    noballBtn.classList.toggle('armed', state.noBallArmed);
    nbState.textContent = state.noBallArmed ? 'armed ⚡' : (state.extraRunOn ? '+1' : '');
    runoutBtn.classList.toggle('armed', state.runOutArmed);
    roState.textContent = state.runOutArmed ? 'armed ⚡' : '';
    wdState.textContent = state.extraRunOn ? '+1' : '';

    if(state.target != null){
      targetRow.classList.add('show');
      const needed = state.target - state.runs;
      if(needed <= 0){
        targetRow.classList.add('won');
        targetNeed.textContent = state.teams[state.battingTeamIndex].name.toUpperCase() + ' WINS 🏆';
        targetSub.textContent = state.prevSummary ? state.prevSummary.team + ' scored ' + state.prevSummary.runs + '/' + state.prevSummary.wickets : '';
      } else {
        targetRow.classList.remove('won');
        targetNeed.textContent = 'NEED ' + needed + ' TO WIN';
        targetSub.textContent = state.prevSummary
          ? 'Target ' + state.target + ' (' + state.prevSummary.team + ' ' + state.prevSummary.runs + '/' + state.prevSummary.wickets + ')'
          : 'Target ' + state.target;
      }
    } else {
      targetRow.classList.remove('show');
    }

    const has = state.history.length > 0;
    undoBtn.disabled = !has && !state.noBallArmed && !state.runOutArmed;
    if(state.noBallArmed){
      undoSub.textContent = 'Tap to cancel armed No Ball';
    } else if(state.runOutArmed){
      undoSub.textContent = 'Tap to cancel armed Run Out';
    } else if(has){
      const last = state.history[state.history.length - 1];
      const d = describe(last);
      undoSub.textContent = 'Last: ' + last.label + ' · ' + d.text;
    } else {
      undoSub.textContent = 'Nothing to undo';
    }

    ledgerWrap.innerHTML = state.history.slice().reverse().slice(0, 40).map(entry=>{
      const d = describe(entry);
      return '<div class="ledger-row"><span class="ledger-ball">' + entry.label +
             '</span><span class="ledger-desc ' + d.cls + '">' + esc(d.text) + '</span></div>';
    }).join('');

    renderStrikerRow();
    renderTeamsPanel();

    if(justScored){
      runsEl.classList.add('pulse');
      setTimeout(()=>runsEl.classList.remove('pulse'), 130);
    }

    syncAfterRender();
  }

  // --- Live sync ---------------------------------------------------------
  // Phones share a match through a free public MQTT broker. Every change
  // publishes the whole match as a "retained" message on a topic named after
  // a 6-character match code, so a phone that joins (or rejoins after the app
  // was closed) gets the latest score straight away. Each phone keeps the full
  // match locally, so any phone can carry on scoring. Every state carries a
  // revision number; the highest revision wins (ties: highest author id), so
  // all phones settle on the same score. Armed No Ball / Run Out stay local.
  const SYNC_URL = window.SYNC_URL_OVERRIDE || 'wss://broker.hivemq.com:8884/mqtt';
  const MQTT_LIB = 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';
  const TOPIC_PREFIX = 'mgamer11-cricket-scoreboard/v1/';
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O, 1/I
  const sync = {
    id: Math.random().toString(36).slice(2, 10),
    code: null, client: null, status: 'off',
    rev: 0, revBy: '', lastSnap: null,
    awaiting: false, joining: false, awaitTimer: null, retryTimer: null
  };
  const syncBtn = el('syncBtn'), syncBtnText = el('syncBtnText'), syncPanel = el('syncPanel');
  const syncOff = el('syncOff'), syncOn = el('syncOn');
  const syncCodeEl = el('syncCodeEl'), syncStatusEl = el('syncStatusEl'), syncCodeInput = el('syncCodeInput');

  function sharedState(){
    return {
      teams: state.teams, battingTeamIndex: state.battingTeamIndex, strikerId: state.strikerId,
      runs: state.runs, wickets: state.wickets, overs: state.overs, ball: state.ball,
      history: state.history, extraRunOn: state.extraRunOn,
      target: state.target, prevSummary: state.prevSummary
    };
  }

  // Called at the end of every render: if the match changed locally, bump the revision and send it.
  function syncAfterRender(){
    const snap = JSON.stringify(sharedState());
    if(snap === sync.lastSnap) return;
    sync.lastSnap = snap;
    sync.rev += 1; sync.revBy = sync.id;
    publishState();
  }

  function publishState(){
    const c = sync.client;
    if(!c || !c.connected || sync.awaiting || !sync.code) return;
    try{
      c.publish(TOPIC_PREFIX + sync.code,
        JSON.stringify({ v:1, rev: sync.rev, by: sync.revBy, from: sync.id, state: sharedState() }),
        { qos:1, retain:true });
    }catch(e){ /* reconnect will reconcile */ }
  }

  function adoptRemote(msg){
    const s = msg.state;
    if(!s || !Array.isArray(s.teams) || s.teams.length !== 2 || !Array.isArray(s.history)) return;
    Object.assign(state, {
      teams: s.teams, battingTeamIndex: s.battingTeamIndex, strikerId: s.strikerId,
      runs: s.runs, wickets: s.wickets, overs: s.overs, ball: s.ball,
      history: s.history, extraRunOn: !!s.extraRunOn,
      target: s.target, prevSummary: s.prevSummary
    });
    if(state.wickets >= 10){ state.noBallArmed = false; state.runOutArmed = false; }
    let maxId = 0;
    state.teams.forEach(t => t.players.forEach(p => { if(p.id > maxId) maxId = p.id; }));
    playerSeed = Math.max(playerSeed, maxId + 1);
    sync.rev = msg.rev; sync.revBy = msg.by;
    sync.lastSnap = JSON.stringify(sharedState());
    render(false);
  }

  function onRemote(msg){
    if(!msg || msg.v !== 1 || typeof msg.rev !== 'number') return;
    const wasAwaiting = sync.awaiting;
    if(wasAwaiting){ sync.awaiting = false; clearTimeout(sync.awaitTimer); renderSync(); }
    if(msg.from === sync.id){
      // Our own message (echo, or the retained copy after a reconnect)
      if(wasAwaiting && msg.rev < sync.rev) publishState();
      return;
    }
    const newer = sync.joining || msg.rev > sync.rev || (msg.rev === sync.rev && msg.by > sync.revBy);
    sync.joining = false;
    if(newer){ adoptRemote(msg); setSyncStatus('live'); }
    else if(msg.rev !== sync.rev || msg.by !== sync.revBy) publishState(); // ours is newer: send it back
    else setSyncStatus('live');
  }

  function setSyncStatus(s){
    sync.status = s;
    renderSync();
  }

  function renderSync(){
    const on = !!sync.code;
    syncOff.style.display = on ? 'none' : '';
    syncOn.style.display = on ? '' : 'none';
    syncCodeEl.textContent = sync.code || '';
    const live = on && sync.status === 'live' && !sync.awaiting;
    syncStatusEl.textContent = !on ? '' :
      sync.status === 'offline' ? 'Offline · will catch up when back' :
      (sync.status === 'connecting' || sync.awaiting) ? (sync.joining ? 'Joining…' : 'Connecting…') : 'Live';
    syncStatusEl.className = 'sync-status' + (live ? ' live' : sync.status === 'offline' ? ' offline' : '');
    syncBtn.classList.toggle('live', live);
    syncBtn.classList.toggle('pending', on && !live);
  }

  function saveSyncCode(code){
    try{ if(code) localStorage.setItem('cs-sync-code', code); else localStorage.removeItem('cs-sync-code'); }catch(e){}
  }

  function loadMqtt(){
    if(window.mqtt) return Promise.resolve(window.mqtt);
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = MQTT_LIB;
      s.onload = () => window.mqtt ? resolve(window.mqtt) : reject(new Error('mqtt missing'));
      s.onerror = () => { s.remove(); reject(new Error('mqtt load failed')); };
      document.head.appendChild(s);
    });
  }

  async function connectSync(code, joining){
    stopClient();
    sync.code = code; sync.joining = joining;
    saveSyncCode(code);
    setSyncStatus('connecting');
    let lib;
    try{ lib = await loadMqtt(); }
    catch(e){
      if(sync.code !== code) return;
      setSyncStatus('offline');
      sync.retryTimer = setTimeout(() => { if(sync.code === code) connectSync(code, sync.joining); }, 5000);
      return;
    }
    if(sync.code !== code || sync.client) return; // stopped or restarted meanwhile
    const topic = TOPIC_PREFIX + code;
    const client = lib.connect(SYNC_URL, {
      clientId: 'cs_' + sync.id + '_' + Math.random().toString(36).slice(2, 6),
      clean: true, keepalive: 20, reconnectPeriod: 2000, connectTimeout: 10000
    });
    sync.client = client;
    client.on('connect', () => {
      if(sync.client !== client) return;
      // Wait for the server's latest copy before sending ours, so a phone
      // that was offline never overwrites newer scores from another phone.
      sync.awaiting = true;
      setSyncStatus('live');
      client.subscribe(topic, { qos:1 }, err => {
        if(err || sync.client !== client) return;
        clearTimeout(sync.awaitTimer);
        sync.awaitTimer = setTimeout(() => {
          if(sync.client !== client || !sync.awaiting) return;
          sync.awaiting = false; sync.joining = false; // nothing stored under this code yet
          publishState();
          renderSync();
        }, 2500);
      });
    });
    client.on('message', (t, payload) => {
      if(sync.client !== client || t !== topic) return;
      let msg; try{ msg = JSON.parse(payload.toString()); }catch(e){ return; }
      onRemote(msg);
    });
    client.on('reconnect', () => { if(sync.client === client) setSyncStatus('connecting'); });
    client.on('offline', () => { if(sync.client === client) setSyncStatus('offline'); });
    client.on('close', () => { if(sync.client === client && sync.status === 'live') setSyncStatus('offline'); });
    client.on('error', () => {});
  }

  function stopClient(){
    clearTimeout(sync.awaitTimer); clearTimeout(sync.retryTimer);
    sync.awaiting = false;
    if(sync.client){ try{ sync.client.end(true); }catch(e){} sync.client = null; }
  }

  function startSync(){
    let code = '';
    for(let i = 0; i < 6; i++) code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    connectSync(code, false); // this phone's match is the starting point
  }

  function joinSync(){
    const code = syncCodeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if(code.length !== 6){ syncCodeInput.focus(); return; }
    syncCodeInput.value = '';
    syncCodeInput.blur();
    connectSync(code, true); // take whatever score the match code already has
  }

  function stopSync(){
    if(!confirm('Stop syncing on this phone? The score stays here, and other phones keep the match.')) return;
    stopClient();
    sync.code = null; sync.joining = false;
    saveSyncCode(null);
    setSyncStatus('off');
  }

  // iOS suspends home screen apps in the background; reconnect straight away when it comes back.
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && sync.client && !sync.client.connected){
      try{ sync.client.reconnect(); }catch(e){}
    }
  });

  // --- Haptics ---------------------------------------------------------
  // iOS Safari has no official Vibration API. This exploits a real iOS 18+
  // WebKit behavior: toggling a native <input type="checkbox"> styled as a
  // switch fires the Taptic Engine. It only works from a genuine, trusted
  // user tap (which every button here already is), so we trigger it inside
  // each click handler. Unofficial + unsupported by Apple — if a future
  // iOS update changes this, it just silently does nothing (safe no-op),
  // and on Android/desktop it's harmless either way.
  const hapticSwitch = el('hapticSwitch');
  function haptic(strong){
    if(!hapticSwitch) return;
    try{
      hapticSwitch.click();
      if(strong){ setTimeout(()=>{ try{ hapticSwitch.click(); }catch(e){} }, 60); }
    }catch(e){ /* no-op */ }
  }

  // Event wiring
  runButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const n = parseInt(btn.dataset.run,10);
      haptic(n === 4 || n === 6);
      addRun(n);
    });
  });
  wicketBtn.addEventListener('click', ()=>{ haptic(true); addWicket(); });
  runoutBtn.addEventListener('click', ()=>{ haptic(false); toggleRunOut(); });
  wideBtn.addEventListener('click', ()=>{ haptic(false); addWide(); });
  extraToggle.addEventListener('click', ()=>{ haptic(false); toggleExtraRun(); });
  noballBtn.addEventListener('click', ()=>{ haptic(false); toggleNoBall(); });
  undoBtn.addEventListener('click', ()=>{ haptic(false); undo(); });
  el('newInningsBtn').addEventListener('click', ()=>{ haptic(true); startNewInnings(); });

  function togglePanel(panel, btn, other, otherBtn){
    panel.classList.toggle('show');
    btn.classList.toggle('open', panel.classList.contains('show'));
    other.classList.remove('show'); otherBtn.classList.remove('open');
  }
  settingsBtn.addEventListener('click', ()=>{ togglePanel(teamsPanel, settingsBtn, syncPanel, syncBtn); });
  syncBtn.addEventListener('click', ()=>{ togglePanel(syncPanel, syncBtn, teamsPanel, settingsBtn); });

  teamNameA.addEventListener('input', ()=>{ state.teams[0].name = teamNameA.value.trim() || 'Team A'; render(false); });
  teamNameB.addEventListener('input', ()=>{ state.teams[1].name = teamNameB.value.trim() || 'Team B'; render(false); });

  document.body.addEventListener('click', (e)=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;
    if(action === 'add-player') addPlayer(parseInt(t.dataset.team,10));
    else if(action === 'remove-player') removePlayer(parseInt(t.dataset.team,10), parseInt(t.dataset.id,10));
    else if(action === 'set-batting') setBattingTeam(parseInt(t.dataset.team,10));
    else if(action === 'select-striker') selectStriker(parseInt(t.dataset.id,10));
    else if(action === 'reset-match') resetMatch();
    else if(action === 'sync-start') startSync();
    else if(action === 'sync-join') joinSync();
    else if(action === 'sync-stop') stopSync();
  });

  el('addPlayerA').addEventListener('keydown', e=>{ if(e.key === 'Enter') addPlayer(0); });
  el('addPlayerB').addEventListener('keydown', e=>{ if(e.key === 'Enter') addPlayer(1); });
  syncCodeInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') joinSync(); });

  render(false);
  renderSync();
  // Rejoin the last match automatically if the app was closed while syncing
  try{ const saved = localStorage.getItem('cs-sync-code'); if(saved) connectSync(saved, true); }catch(e){}
</script>
</body>
</html>
